name: rank
on:
  push:
    paths: ["hunt/**", "tests/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rank:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pytest && python -m pytest -q
      - run: python -m hunt.rank
      - run: |
          git config user.name "rank-bot"
          git config user.email "rank-bot@users.noreply.github.com"
          git add reports/ranking.md
          git diff --cached --quiet || (git commit -m "Update ranking" && git push)
